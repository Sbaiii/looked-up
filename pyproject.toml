[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lookedup"
version = "0.1.0"
description = "Hour-by-hour attention across languages, from Wikipedia pageviews."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Sbaiii" }]
dependencies = [
    "duckdb>=1.1",
    "numpy>=1.26",
    "pyarrow>=15",
    "requests>=2.31",
    "huggingface_hub>=0.25",
    "pyyaml>=6",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
warehouse = ["dbt-duckdb>=1.9", "scipy>=1.11", "matplotlib>=3.8"]
forecast = ["lightgbm==4.6.0", "scikit-learn==1.7.2"]

[project.scripts]
lookedup = "lookedup.cli:main"

[tool.setuptools.packages.find]
include = ["lookedup*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
