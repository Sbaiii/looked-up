version: 2

models:
  - name: stg_hourly
    description: Typed hourly article views (desktop, mobile, total, mobile share) with calendar fields.
    columns:
      - name: ts_hour_start
        description: "Start of the UTC hour the views belong to."
        tests: [not_null]
      - name: lang
        description: "Wiki code, one of the 30 active languages."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: "{{ var('languages') }}"
      - name: title
        description: "Article title as in the dumps (underscores)."
        tests: [not_null]
      - name: views
        description: "Desktop plus mobile views in the hour."
        tests: [not_null]
      - name: day
        description: "UTC date of the hour."
      - name: hour_of_day
        description: "UTC hour, 0 to 23."
      - name: is_weekend
        description: "True on the configured weekend days."
      - name: views_desktop
        description: "Desktop views (the xx project)."
      - name: views_mobile
        description: "Mobile views (the xx.m project)."
      - name: mobile_share
        description: "Mobile views over all views."

  - name: stg_sitelinks
    description: (lang, title) -> numeric Wikidata QID.
    columns:
      - name: qid
        description: "Numeric Wikidata item id (no Q prefix)."
        tests: [not_null]
      - name: lang
        description: "Wiki code of the sitelink."
      - name: title
        description: "Article title with underscores, as in the dumps."

  - name: stg_manifest_hours
    description: Hours listed in data/manifest.json, with row counts and source.
    config:
      lake_root: "{{ var('lake_root') }}"
    columns:
      - name: ts_hour_start
        description: "An hour present in the lake manifest."
        tests: [unique, not_null]
      - name: source
        description: "Where the hour came from: the hourly dump or the pageview_complete backfill."
        tests:
          - accepted_values:
              arguments:
                values: ["hourly_dump", "pageview_complete"]
      - name: rows
        description: "Rows ingested for the hour."
      - name: path
        description: "Day file holding the hour."

  - name: int_automation_flags
    description: (lang, title, day) rows with >= 500 views that day and the automation flags (prereg §2).
    columns:
      - name: flag_id
        description: "lang|title|day, one row per article-day."
        tests: [unique, not_null]
      - name: is_automated
        description: "True when the low-mobile or the flat rule flags the article-day."
        tests: [not_null]
      - name: lang
        description: "Wiki code."
      - name: title
        description: "Article title."
      - name: day
        description: "UTC date."
      - name: day_views
        description: "Views of the article that day."
      - name: mobile_share
        description: "Mobile share of the day's views."
      - name: hourly_mean
        description: "Mean views per hour that day."
      - name: hourly_cv
        description: "Coefficient of variation of the 24 hourly views."
      - name: is_low_mobile
        description: "Low-mobile rule: enough views with a mobile share under the threshold."
      - name: is_flat
        description: "Flat rule: a busy article whose hourly series barely varies."

  - name: int_language_priors
    description: Per scored day and language, the prior median/MAD used for unseen entities.
    columns:
      - name: prior_median
        description: "Median hourly views of the language over the lookback days, from a hashed sample of articles seen on enough days; the baseline of unseen entities."
        tests: [not_null]
      - name: day
        description: "The scored day the prior is used for."
      - name: lang
        description: "Wiki code."
      - name: prior_mad
        description: "Median absolute deviation matching prior_median."

  - name: int_baselines
    description: Every article-hour with >= 100 views in the evaluation period, with baseline, R1/R2 inputs and surprise.
    columns:
      - name: candidate_id
        description: "lang|title|hour, one row per scored article-hour."
        tests: [unique, not_null]
      - name: baseline_level
        description: "Which baseline was used: same weekday type, same hour of day, or the language prior when the history is too short."
        tests:
          - accepted_values:
              arguments:
                values: ["day_type", "hour", "prior"]
      - name: surprise
        description: "Robust score R3: views above the baseline median, scaled by the MAD plus a Poisson term."
        tests: [not_null]
      - name: ts_hour_start
        description: "The scored hour."
      - name: day
        description: "UTC date of the hour."
      - name: hour_of_day
        description: "UTC hour, 0 to 23."
      - name: is_weekend
        description: "True on the configured weekend days."
      - name: lang
        description: "Wiki code."
      - name: title
        description: "Article title."
      - name: views
        description: "Desktop plus mobile views in the hour."
      - name: views_desktop
        description: "Desktop views."
      - name: views_mobile
        description: "Mobile views."
      - name: mobile_share
        description: "Mobile views over all views."
      - name: views_yesterday
        description: "Views in the same hour the day before."
      - name: prev3_median
        description: "Median views of the previous 3 hours."
      - name: unseen
        description: "True when the article has too little history: the language prior is used and R1 is off."
      - name: baseline_median
        description: "Median of the baseline sample."
      - name: baseline_mad
        description: "Median absolute deviation of the baseline sample."
      - name: r1
        description: "Day-over-day rule against views_yesterday."
      - name: r2
        description: "Hour-over-hour rule against prev3_median."

  - name: int_spikes
    description: Candidate rows passing R1 or R2 with surprise >= the lowest ablation threshold; is_spike = primary rule.
    columns:
      - name: spike_id
        description: "Candidate id of the article-hour that spiked."
        tests: [unique, not_null]
      - name: entity_key
        description: "Q<id> when the article has a Wikidata item, else lang:title."
        tests: [not_null]
      - name: ts_hour_start
        description: "The spiking hour."
      - name: day
        description: "UTC date of the hour."
      - name: hour_of_day
        description: "UTC hour, 0 to 23."
      - name: lang
        description: "Wiki code."
      - name: title
        description: "Article title."
      - name: qid
        description: "Numeric Wikidata item id, when the article has one."
      - name: views
        description: "Desktop plus mobile views in the hour."
      - name: views_desktop
        description: "Desktop views."
      - name: views_mobile
        description: "Mobile views."
      - name: mobile_share
        description: "Mobile views over all views."
      - name: views_yesterday
        description: "Views in the same hour the day before (R1)."
      - name: prev3_median
        description: "Median views of the previous 3 hours (R2)."
      - name: baseline_level
        description: "Which baseline was used: day_type, hour or the language prior."
      - name: unseen
        description: "True when the article has too little history, so the language prior is used and R1 is off."
      - name: baseline_median
        description: "Median of the baseline sample."
      - name: baseline_mad
        description: "Median absolute deviation of the baseline sample."
      - name: surprise
        description: "Robust score R3 of the hour against the baseline."
      - name: r1
        description: "Day-over-day rule: at least the configured ratio of yesterday's views, above the view floor."
      - name: r2
        description: "Hour-over-hour rule: at least the configured ratio of the previous 3 hours' median, above the floor."
      - name: is_low_mobile
        description: "Automation flag: many views with a very low mobile share that day."
      - name: is_flat
        description: "Automation flag: a busy article with an almost flat hourly series that day."
      - name: is_spike
        description: "The primary rule: surprise at or above R3 and not automated."

  - name: dim_entities
    description: Entities that can form events (loosest ablation), with labels in the 30 languages and a coarse class.
    columns:
      - name: qid
        description: "Numeric Wikidata item id."
        tests: [unique, not_null]
      - name: entity_class
        description: "Coarse class from direct P31/P106 values (no subclass traversal)."
        tests:
          - accepted_values:
              arguments:
                values: ["human", "sports", "entertainment", "disaster", "politics", "place", "organization",
                         "science_tech", "other"]
      - name: label_en
        description: "English label from Wikidata, when there is one."
      - name: is_human
        description: "True when P31 includes Q5 (human)."
      - name: is_generic
        description: "True when a P31 class is in the configured generic classes (dates, lists and the like)."
      - name: p31
        description: "Direct P31 (instance of) item ids."
      - name: dates_of_death
        description: "P570 values as Wikidata time strings."
      - name: countries
        description: "P17 (country) item ids."
      - name: locations
        description: "P276 (location) item ids."
      - name: descriptions_json
        description: "Wikidata descriptions in the app languages, as JSON."
      - name: gender
        description: "From P21, used to word the briefing (ADR 0026)."
      - name: labels
        description: "Article title per language among the active ones, from the sitelinks."
      - name: n_languages
        description: "How many of the active languages have an article."

  - name: fct_attention_events
    description: Attention events under the primary configuration (prereg §2).
    columns:
      - name: event_id
        description: "Q<id>@YYYYMMDDTHH: the entity and the hour the event starts."
        tests: [unique, not_null]
      - name: lead_lang
        description: "First language to spike."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: "{{ var('languages') }}"
      - name: breadth
        description: "Languages spiking within 24 h of the start."
        tests: [not_null]
      - name: category
        description: "death when P570 falls within the event week, else the entity class."
        tests:
          - accepted_values:
              arguments:
                values: ["death", "human", "sports", "entertainment", "disaster", "politics", "place",
                         "organization", "science_tech", "other"]
      - name: event_class
        description: "multi_language, or single_language when the lead language holds at least 95 % of the excess views (ADR 0019)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["multi_language", "single_language"]
      - name: qid
        description: "Numeric Wikidata item id of the entity."
        tests:
          - relationships:
              arguments:
                to: ref('dim_entities')
                field: qid
      - name: start_hour
        description: "First spike of the earliest window that holds spikes in the minimum number of languages (ADR 0013)."
      - name: peak_intensity
        description: "Highest surprise reached in any language within 24 h of the start."
      - name: excess_views
        description: "Views above each article's baseline, summed over languages for 24 h from the start."
      - name: median_spread_lag_hours
        description: "Median hours from the start to each non-lead language's first spike."
      - name: max_spread_lag_hours
        description: "Hours from the start to the last language's first spike."
      - name: languages
        description: "Spiking languages in order of first spike."
      - name: lead_excess_share
        description: "Share of the excess views held by the lead language (ADR 0019)."
      - name: tier
        description: "Breadth tier: noticed, international or planetary (ADR 0021)."
      - name: label_en
        description: "English label of the entity, when it has one."
      - name: entity_class
        description: "Coarse class of the entity, from dim_entities."
      - name: is_human
        description: "True when the entity is a human (P31 = Q5)."

  - name: fct_event_languages
    description: One row per (event, spiking language) with spread lag.
    columns:
      - name: event_lang_id
        description: "event_id|lang."
        tests: [unique, not_null]
      - name: event_id
        description: "The event this language belongs to."
        tests:
          - relationships:
              arguments:
                to: ref('fct_attention_events')
                field: event_id
      - name: qid
        description: "Numeric Wikidata item id of the entity."
      - name: start_hour
        description: "Start of the event this row belongs to."
      - name: lang
        description: "The spiking language."
      - name: first_spike
        description: "First spiking hour of this language in the event."
      - name: spread_lag_hours
        description: "Hours from the event start to this language's first spike."
      - name: peak_surprise
        description: "Highest surprise of this language in the event."
      - name: spike_hours
        description: "Number of spiking hours of this language in the event."
      - name: excess_views
        description: "Views above baseline in this language over the event's first 24 h."
      - name: is_lead
        description: "True for the lead language."
      - name: title
        description: "Article title in this language."

  - name: fct_app_events
    description: Attention events under the product configuration (ADR 0021), with tier.
    columns:
      - name: event_id
        description: "Q<id>@YYYYMMDDTHH under the product rule (2 languages)."
        tests: [unique, not_null]
      - name: breadth
        description: "Languages spiking within 24 h of the start."
        tests: [not_null]
      - name: tier
        description: "noticed (2+ languages), international (5+) or planetary (20+), from the breadth."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["noticed", "international", "planetary"]
      - name: event_class
        description: "multi_language or single_language (lead share of at least 95 %)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["multi_language", "single_language"]
      - name: qid
        description: "Numeric Wikidata item id of the entity."
      - name: start_hour
        description: "First spike of the earliest window with spikes in 2 languages."
      - name: lead_lang
        description: "First language to spike."
      - name: peak_intensity
        description: "Highest surprise in any language within 24 h of the start."
      - name: excess_views
        description: "Views above baseline, summed over languages for 24 h from the start."
      - name: median_spread_lag_hours
        description: "Median hours from the start to each non-lead language's first spike."
      - name: max_spread_lag_hours
        description: "Hours from the start to the last language's first spike."
      - name: languages
        description: "Spiking languages in order of first spike."
      - name: lead_excess_share
        description: "Share of the excess views held by the lead language."
      - name: label_en
        description: "English label of the entity, when it has one."
      - name: entity_class
        description: "Coarse class of the entity, from dim_entities."
      - name: is_human
        description: "True when the entity is a human (P31 = Q5)."
      - name: category
        description: "death when P570 falls within the event week, else the entity class."

  - name: fct_app_event_languages
    description: One row per (product event, spiking language) with spread lag.
    columns:
      - name: event_lang_id
        description: "event_id|lang."
        tests: [unique, not_null]
      - name: event_id
        description: "The product event this language belongs to."
        tests:
          - relationships:
              arguments:
                to: ref('fct_app_events')
                field: event_id
      - name: qid
        description: "Numeric Wikidata item id of the entity."
      - name: start_hour
        description: "Start of the product event."
      - name: lang
        description: "The spiking language."
      - name: first_spike
        description: "First spiking hour of this language in the event."
      - name: spread_lag_hours
        description: "Hours from the event start to this language's first spike."
      - name: peak_surprise
        description: "Highest surprise of this language in the event."
      - name: spike_hours
        description: "Spiking hours of this language in the event."
      - name: excess_views
        description: "Views above baseline in this language over the first 24 h."
      - name: is_lead
        description: "True for the lead language."
      - name: title
        description: "Article title in this language."

  - name: fct_event_snapshots
    description: Decision-time snapshots of multi-language product events with M1/M2 targets (prereg phase 4).
    columns:
      - name: snapshot_id
        description: "event_id#offset: one snapshot per event and offset."
        tests: [unique, not_null]
      - name: offset_h
        description: "Hours after detection (t0, t0 + 1 h, t0 + 3 h)."
        tests:
          - accepted_values:
              arguments:
                values: [0, 1, 3]
      - name: event_id
        description: "The product event being forecast."
        tests:
          - relationships:
              arguments:
                to: ref('fct_app_events')
                field: event_id
      - name: qid
        description: "Numeric Wikidata item id of the entity."
      - name: start_hour
        description: "Start of the event."
      - name: t0
        description: "Detection hour: the second language's first spike."
      - name: snapshot_ts
        description: "The hour T the snapshot describes; every feature uses hours up to T only."
      - name: lead_lang
        description: "Lead language of the event (categorical feature)."
      - name: entity_class
        description: "Coarse class of the entity (categorical feature)."
      - name: breadth_t
        description: "Languages spiking at R3 >= 8 by T."
      - name: max_surprise_t
        description: "Highest surprise by T."
      - name: sum_surprise_t
        description: "Sum of surprises at R3 >= 8 by T."
      - name: excess_t
        description: "Excess views of the spike rows by T."
      - name: lead_share_t
        description: "Share of excess_t held by the lead language."
      - name: new_langs_last_hour
        description: "Languages whose first spike falls in the hour ending at T."
      - name: hours_since_start
        description: "Hours from the event start to T."
      - name: is_death
        description: "1 when the event is a death (a declared leakage risk)."
      - name: hour_utc
        description: "UTC hour of T."
      - name: weekday
        description: "Day of the week of T, Monday = 0."
      - name: n_sitelinks
        description: "How many active languages have an article: fame (a declared leakage risk)."
      - name: views_t
        description: "Total views at T of the articles known by then."
      - name: views_slope
        description: "log1p of views at T minus log1p of views two hours earlier."
      - name: peak_views_so_far
        description: "Highest hourly total up to T."
      - name: lead_views_share
        description: "Share of the views up to T read in the lead language."
      - name: excess_hour_t
        description: "Excess views in the hour T itself (baseline input, not a model feature)."
      - name: hours_since_peak
        description: "Hours from the highest hourly total to T (baseline input, not a model feature)."
      - name: category
        description: "death when P570 falls within the event week, else the entity class."
      - name: reach_international
        description: "M1 target: 1 when the event reaches 5 languages."
      - name: reach_planetary
        description: "M1 target: 1 when the event reaches 20 languages."
      - name: excess_next24
        description: "M2 target: excess views in the 24 h after T."
      - name: fade_hours
        description: "M2 target: hours from T until views fall below half the peak, capped at 48."
      - name: fade_observable
        description: "True when the 48 h fade window ends before the end of the data."
