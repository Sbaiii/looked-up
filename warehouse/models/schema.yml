version: 2

models:
  - name: stg_hourly
    description: Typed hourly article views (desktop, mobile, total, mobile share) with calendar fields.
    columns:
      - name: ts_hour_start
        description: "Start of the UTC hour the views belong to."
        tests: [not_null]
      - name: lang
        description: "Wiki code, one of the 30 active languages."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: "{{ var('languages') }}"
      - name: title
        description: "Article title as in the dumps (underscores)."
        tests: [not_null]
      - name: views
        description: "Desktop plus mobile views in the hour."
        tests: [not_null]

  - name: stg_sitelinks
    description: (lang, title) -> numeric Wikidata QID.
    columns:
      - name: qid
        description: "Numeric Wikidata item id (no Q prefix)."
        tests: [not_null]

  - name: stg_manifest_hours
    description: Hours listed in data/manifest.json, with row counts and source.
    config:
      lake_root: "{{ var('lake_root') }}"
    columns:
      - name: ts_hour_start
        description: "An hour present in the lake manifest."
        tests: [unique, not_null]
      - name: source
        description: "Where the hour came from: the hourly dump or the pageview_complete backfill."
        tests:
          - accepted_values:
              arguments:
                values: ["hourly_dump", "pageview_complete"]

  - name: int_automation_flags
    description: (lang, title, day) rows with >= 500 views that day and the automation flags (prereg §2).
    columns:
      - name: flag_id
        description: "lang|title|day, one row per article-day."
        tests: [unique, not_null]
      - name: is_automated
        description: "True when the low-mobile or the flat rule flags the article-day."
        tests: [not_null]

  - name: int_language_priors
    description: Per scored day and language, the prior median/MAD used for unseen entities.
    columns:
      - name: prior_median
        description: "Median hourly views of the language over the lookback days, from a hashed sample of articles seen on enough days; the baseline of unseen entities."
        tests: [not_null]

  - name: int_baselines
    description: Every article-hour with >= 100 views in the evaluation period, with baseline, R1/R2 inputs and surprise.
    columns:
      - name: candidate_id
        description: "lang|title|hour, one row per scored article-hour."
        tests: [unique, not_null]
      - name: baseline_level
        description: "Which baseline was used: same weekday type, same hour of day, or the language prior when the history is too short."
        tests:
          - accepted_values:
              arguments:
                values: ["day_type", "hour", "prior"]
      - name: surprise
        description: "Robust score R3: views above the baseline median, scaled by the MAD plus a Poisson term."
        tests: [not_null]

  - name: int_spikes
    description: Candidate rows passing R1 or R2 with surprise >= the lowest ablation threshold; is_spike = primary rule.
    columns:
      - name: spike_id
        description: "Candidate id of the article-hour that spiked."
        tests: [unique, not_null]
      - name: entity_key
        description: "Q<id> when the article has a Wikidata item, else lang:title."
        tests: [not_null]

  - name: dim_entities
    description: Entities that can form events (loosest ablation), with labels in the 30 languages and a coarse class.
    columns:
      - name: qid
        description: "Numeric Wikidata item id."
        tests: [unique, not_null]
      - name: entity_class
        description: "Coarse class from direct P31/P106 values (no subclass traversal)."
        tests:
          - accepted_values:
              arguments:
                values: ["human", "sports", "entertainment", "disaster", "politics", "place", "organization",
                         "science_tech", "other"]
      - name: label_en
        description: "English label from Wikidata, when there is one."
      - name: is_human
        description: "True when P31 includes Q5 (human)."
      - name: is_generic
        description: "True when a P31 class is in the configured generic classes (dates, lists and the like)."
      - name: p31
        description: "Direct P31 (instance of) item ids."
      - name: dates_of_death
        description: "P570 values as Wikidata time strings."
      - name: countries
        description: "P17 (country) item ids."
      - name: locations
        description: "P276 (location) item ids."
      - name: descriptions_json
        description: "Wikidata descriptions in the app languages, as JSON."
      - name: gender
        description: "From P21, used to word the briefing (ADR 0026)."
      - name: labels
        description: "Article title per language among the active ones, from the sitelinks."
      - name: n_languages
        description: "How many of the active languages have an article."

  - name: fct_attention_events
    description: Attention events under the primary configuration (prereg §2).
    columns:
      - name: event_id
        description: "Q<id>@YYYYMMDDTHH: the entity and the hour the event starts."
        tests: [unique, not_null]
      - name: lead_lang
        description: "First language to spike."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: "{{ var('languages') }}"
      - name: breadth
        description: "Languages spiking within 24 h of the start."
        tests: [not_null]
      - name: category
        description: "death when P570 falls within the event week, else the entity class."
        tests:
          - accepted_values:
              arguments:
                values: ["death", "human", "sports", "entertainment", "disaster", "politics", "place",
                         "organization", "science_tech", "other"]
      - name: event_class
        description: "multi_language, or single_language when the lead language holds at least 95 % of the excess views (ADR 0019)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["multi_language", "single_language"]
      - name: qid
        description: "Numeric Wikidata item id of the entity."
        tests:
          - relationships:
              arguments:
                to: ref('dim_entities')
                field: qid
      - name: start_hour
        description: "First spike of the earliest window that holds spikes in the minimum number of languages (ADR 0013)."
      - name: peak_intensity
        description: "Highest surprise reached in any language within 24 h of the start."
      - name: excess_views
        description: "Views above each article's baseline, summed over languages for 24 h from the start."
      - name: median_spread_lag_hours
        description: "Median hours from the start to each non-lead language's first spike."
      - name: max_spread_lag_hours
        description: "Hours from the start to the last language's first spike."
      - name: languages
        description: "Spiking languages in order of first spike."
      - name: lead_excess_share
        description: "Share of the excess views held by the lead language (ADR 0019)."
      - name: tier
        description: "Breadth tier: noticed, international or planetary (ADR 0021)."
      - name: label_en
        description: "English label of the entity, when it has one."
      - name: entity_class
        description: "Coarse class of the entity, from dim_entities."
      - name: is_human
        description: "True when the entity is a human (P31 = Q5)."

  - name: fct_event_languages
    description: One row per (event, spiking language) with spread lag.
    columns:
      - name: event_lang_id
        description: "event_id|lang."
        tests: [unique, not_null]
      - name: event_id
        description: "The event this language belongs to."
        tests:
          - relationships:
              arguments:
                to: ref('fct_attention_events')
                field: event_id
      - name: qid
        description: "Numeric Wikidata item id of the entity."
      - name: start_hour
        description: "Start of the event this row belongs to."
      - name: lang
        description: "The spiking language."
      - name: first_spike
        description: "First spiking hour of this language in the event."
      - name: spread_lag_hours
        description: "Hours from the event start to this language's first spike."
      - name: peak_surprise
        description: "Highest surprise of this language in the event."
      - name: spike_hours
        description: "Number of spiking hours of this language in the event."
      - name: excess_views
        description: "Views above baseline in this language over the event's first 24 h."
      - name: is_lead
        description: "True for the lead language."
      - name: title
        description: "Article title in this language."

  - name: fct_app_events
    description: Attention events under the product configuration (ADR 0021), with tier.
    columns:
      - name: event_id
        description: "Q<id>@YYYYMMDDTHH under the product rule (2 languages)."
        tests: [unique, not_null]
      - name: breadth
        description: "Languages spiking within 24 h of the start."
        tests: [not_null]
      - name: tier
        description: "noticed (2+ languages), international (5+) or planetary (20+), from the breadth."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["noticed", "international", "planetary"]
      - name: event_class
        description: "multi_language or single_language (lead share of at least 95 %)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["multi_language", "single_language"]
      - name: qid
        description: "Numeric Wikidata item id of the entity."
      - name: start_hour
        description: "First spike of the earliest window with spikes in 2 languages."
      - name: lead_lang
        description: "First language to spike."
      - name: peak_intensity
        description: "Highest surprise in any language within 24 h of the start."
      - name: excess_views
        description: "Views above baseline, summed over languages for 24 h from the start."
      - name: median_spread_lag_hours
        description: "Median hours from the start to each non-lead language's first spike."
      - name: max_spread_lag_hours
        description: "Hours from the start to the last language's first spike."
      - name: languages
        description: "Spiking languages in order of first spike."
      - name: lead_excess_share
        description: "Share of the excess views held by the lead language."
      - name: label_en
        description: "English label of the entity, when it has one."
      - name: entity_class
        description: "Coarse class of the entity, from dim_entities."
      - name: is_human
        description: "True when the entity is a human (P31 = Q5)."
      - name: category
        description: "death when P570 falls within the event week, else the entity class."

  - name: fct_app_event_languages
    description: One row per (product event, spiking language) with spread lag.
    columns:
      - name: event_lang_id
        description: "event_id|lang."
        tests: [unique, not_null]
      - name: event_id
        description: "The product event this language belongs to."
        tests:
          - relationships:
              arguments:
                to: ref('fct_app_events')
                field: event_id

  - name: fct_event_snapshots
    description: Decision-time snapshots of multi-language product events with M1/M2 targets (prereg phase 4).
    columns:
      - name: snapshot_id
        description: "event_id#offset: one snapshot per event and offset."
        tests: [unique, not_null]
      - name: offset_h
        description: "Hours after detection (t0, t0 + 1 h, t0 + 3 h)."
        tests:
          - accepted_values:
              arguments:
                values: [0, 1, 3]
      - name: event_id
        description: "The product event being forecast."
        tests:
          - relationships:
              arguments:
                to: ref('fct_app_events')
                field: event_id
