# Phase 2 analytics configuration. PRIMARY CONFIGURATION, pre-registered in docs/prereg_phase2.md
# (2026-10-08). Changing any value after results are seen is a deviation: log it in an ADR and in the results.

period:
  start: "2026-07-09"          # first hour used (baselines only during warm-up)
  eval_start: "2026-07-16"     # first hour scored and evaluated (7-day warm-up)
  end: "2026-10-07"            # last day, inclusive
  completeness_min: 0.98       # share of hours that must be present in the manifest

automation:
  day_views_min: 500           # (a) day views >= this ...
  mobile_share_max: 0.05       #     ... and mobile share below this
  flat_cv_max: 0.15            # (b) coefficient of variation of hourly views over the day below this ...
  flat_hourly_mean_min: 200    #     ... with mean views per hour >= this

baseline:
  lookback_days: 28
  min_observations: 7
  weekend_days: [5, 6]         # ISO weekday - 1 (Mon=0): Saturday, Sunday
  prior_min_days_seen: 7       # entities feeding the language-level prior

spike:
  r1_ratio: 5.0                # views >= 5 x same hour yesterday
  r2_ratio: 3.0                # views >= 3 x median of previous 3 hours
  r2_hours: 3
  min_views: 100               # floor for R1 and R2
  r3_threshold: 8.0            # surprise score
  mad_scale: 1.4826

event:
  min_languages: 3
  window_hours: 6
  breadth_hours: 24
  new_event_gap_hours: 24

evaluation:
  recall_windows_hours: [6, 24]
  major_min_languages: 3       # sitelinks among our 30 languages
  precision_window_days: 2
  manual_review_top_n: 30
  h3_pool_size: 1000
  h3_sample_size: 100
  h3_seed: 20261008
  h3_min_non_events: 20
  h4_min_group_size: 10
  h4_alpha: 0.05
  death_window_days_before: 7
  death_window_days_after: 1

ablations:
  r3_threshold: [6, 8, 12]
  min_languages: [2, 3, 5]
  window_hours: [3, 6, 12]

