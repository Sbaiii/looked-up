# Live layer rules (docs/prereg_phase5.md, tuned in ADR 0032). One source for the Python reference implementation
# (live/lookedup_live) and the Cloudflare Worker (worker/, generated into worker/src/rules.json by `npm run rules`).

windows_minutes: [10, 30, 60]

burst:                       # an article bursts at >= edits by >= editors within window, and 2 x edits >= ratio x baseline
  edits: 5
  editors: 3
  window_minutes: 30
  ratio: 8.0

new_article:                 # a new page edited >= edits times by >= editors within window of its creation
  edits: 5
  editors: 2                 # ADR 0032: single-author page creation is not attention
  window_minutes: 60

baseline:
  default: 1.0               # median edits per edited article-hour before min_hours of own history
  hours: 168
  min_hours: 24

cooldown_hours: 6            # an article bursts at most once per cooldown
live_event_window_minutes: 120   # ADR 0032: same QID bursting in >= 2 languages within this window (was 30)
keep_bursts_hours: 72
live_window_minutes: 60      # /live.json covers this window
single_bursts_shown: 5       # ranked by distinct editors, then edits
hourly_counts_hours: 168     # hourly live-event counts kept for a week (to judge the rules)

maintenance_patterns:
  - '\brevert'
  - '\bundo\b'
  - '\bundid\b'
  - '\brollback\b'
  - '^rv\b'
  - '\brv\s'
  - 'reverted edits'
  - 'undid revision'
  - '\bAWB\b'
  - '\bHotCat\b'
  - '\bTwinkle\b'
  - '\bhuggle\b'
  - '\bIABot\b'
  - 'InternetArchiveBot'
  - '\bWPCleaner\b'
  - '^\s*\{\{[^}]*\}\}\s*$'
  - '\btypos?\b'
  - 'fix typo'
  - 'copyedit'
revert_tags: [mw-reverted, mw-rollback, mw-undo, mw-manual-revert]
