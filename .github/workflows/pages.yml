name: pages

# Deploys app/ (static, no build step) to GitHub Pages. The app reads its data from the Hugging Face
# dataset at runtime (ADR 0022), so hourly data updates need no redeploy. No commits from workflows.
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
