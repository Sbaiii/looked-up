name: backfill

# Manual backfill from pageview_complete, the remote alternative to running
# `python -m lookedup.backfill` locally. Resumable: completed days are skipped.
on:
  workflow_dispatch:
    inputs:
      from:
        description: "First day (YYYY-MM-DD)"
        required: true
      to:
        description: "Last day (YYYY-MM-DD)"
        required: true

concurrency:
  group: lake-writer-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - name: Check HF token
        run: test -n "$HF_TOKEN" || { echo "::error::HF_TOKEN secret is not set"; exit 1; }
      - name: Backfill
        run: python -m lookedup.backfill --from "${{ inputs.from }}" --to "${{ inputs.to }}"
