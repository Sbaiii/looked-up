name: live layer (disabled)

# DISABLED (ADR 0032, superseding ADR 0030): chained always-on jobs conflict with GitHub's Actions usage terms and
# put the hourly pipeline at risk. The live layer now runs on its own host (see docs/ops.md). This workflow is kept
# for a one-off manual run only; nothing schedules or queues it any more.
on:
  workflow_dispatch:

concurrency:
  group: live-layer
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  shift:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: live/requirements.txt
      - run: pip install -r live/requirements.txt
      - name: Run one shift and publish to the lake
        if: env.HF_TOKEN != ''
        working-directory: live
        run: python -m lookedup_live.shift --hours 5.7 --every 300
