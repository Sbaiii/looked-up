name: hub maintenance

# Monthly: squash the dataset repo's history on the Hugging Face Hub so storage held by old
# versions of rewritten files (day files, latest.json, manifest) is released (ADR 0018).
# WARNING: super_squash_history rewrites the dataset repo's history into a single commit.
# Old revisions (and links pinned to old commit hashes) stop working. The data itself is kept.
on:
  schedule:
    - cron: "41 4 2 * *"
  workflow_dispatch:

concurrency:
  group: lake-writer-maintenance
  cancel-in-progress: false

permissions:
  contents: read  # pipelines write to the lake on Hugging Face, never to this repo

jobs:
  squash:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - name: Check HF token
        id: token
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::warning title=HF_TOKEN missing::Repository secret HF_TOKEN is not set; skipping."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Squash dataset history and report storage
        if: steps.token.outputs.present == 'true'
        run: python -m lookedup.cli hub --squash
