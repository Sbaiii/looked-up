name: hourly ingest

on:
  schedule:
    # :45 leaves room for the ~2h14 median publication lag plus Actions' own scheduling delay;
    # each run catches up every missing hour of the last 72 h, so late or dropped runs are harmless.
    - cron: "45 * * * *"
  workflow_dispatch:
    inputs:
      max_hours:
        description: "Max hours to ingest in this run"
        default: "6"

concurrency:
  group: lake-writer-hourly
  cancel-in-progress: false

permissions:
  contents: read  # pipelines write to the lake on Hugging Face, never to this repo

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - name: Check HF token
        id: token
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::warning title=HF_TOKEN missing::Repository secret HF_TOKEN is not set; skipping. Add it with: gh secret set HF_TOKEN -R ${{ github.repository }}"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Ingest missing hours
        if: steps.token.outputs.present == 'true'
        run: python -m lookedup.cli hourly --max-hours "${{ inputs.max_hours || '6' }}"
      - name: Score ingested hours (spikes, events, latest.json)
        if: steps.token.outputs.present == 'true'
        run: python -m lookedup.cli score --max-hours 6
