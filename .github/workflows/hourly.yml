name: hourly ingest

on:
  schedule:
    # :45 leaves room for the ~2h14 median publication lag plus Actions' own scheduling delay;
    # each run catches up every missing hour of the last 72 h, so late or dropped runs are harmless.
    - cron: "45 * * * *"
  workflow_dispatch:
    inputs:
      max_hours:
        description: "Max hours to ingest in this run"
        default: "6"

concurrency:
  group: lake-writer-hourly
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - name: Check HF token
        run: test -n "$HF_TOKEN" || { echo "::error::HF_TOKEN secret is not set"; exit 1; }
      - name: Ingest missing hours
        run: python -m lookedup.cli hourly --max-hours "${{ inputs.max_hours || '6' }}"
