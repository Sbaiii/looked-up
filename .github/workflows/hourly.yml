name: hourly ingest

on:
  schedule:
    # An uncommon minute: GitHub drops scheduled jobs at busy times (top and bottom of the hour),
    # and dropped 6 of 8 runs at :45. Each run catches up every missing hour of the last 7 days,
    # 12 at a time, so late or dropped runs are harmless. trigger.yml offers an external path (ADR 0017).
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      max_hours:
        description: "Max hours to ingest in this run"
        default: "12"

concurrency:
  group: lake-writer-hourly
  cancel-in-progress: false

permissions:
  contents: read  # pipelines write to the lake on Hugging Face, never to this repo

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[forecast]"
      - name: Check HF token
        id: token
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::warning title=HF_TOKEN missing::Repository secret HF_TOKEN is not set; skipping. Add it with: gh secret set HF_TOKEN -R ${{ github.repository }}"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Ingest missing hours
        if: steps.token.outputs.present == 'true'
        run: python -m lookedup.cli hourly --max-hours "${{ inputs.max_hours || '12' }}"
      - name: Day
        id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore cached baselines
        id: baselines
        uses: actions/cache/restore@v4
        with:
          path: ~/looked-up-data/baselines
          key: baselines-${{ steps.day.outputs.day }}
          restore-keys: baselines-
      - name: Score ingested hours (spikes, events, latest.json)
        if: steps.token.outputs.present == 'true'
        run: python -m lookedup.cli score --max-hours 12
      - name: Check for recomputed baselines
        id: recomputed
        if: steps.token.outputs.present == 'true' && steps.baselines.outputs.cache-hit != 'true'
        # hashFiles() only sees the workspace, and the baselines live in ~/looked-up-data
        run: |
          if [ -f "$HOME/looked-up-data/baselines/day=${{ steps.day.outputs.day }}.parquet" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Save recomputed baselines (cache miss only)
        if: steps.recomputed.outputs.exists == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/looked-up-data/baselines
          key: baselines-${{ steps.day.outputs.day }}
      - name: Export app data (data/app/ on the Hub, ADR 0022)
        if: steps.token.outputs.present == 'true'
        run: python -m lookedup.cli app-export
