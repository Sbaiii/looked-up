name: daily baselines

on:
  schedule:
    # 03:30 UTC: yesterday's last hours are usually published by ~02:15 (median lag) and ingested at 02:45
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "UTC day to build baselines for (default: today)"
        required: false
      retrain:
        description: "Retrain the forecast models now (otherwise Mondays only)"
        type: boolean
        default: false

concurrency:
  group: lake-writer-daily
  cancel-in-progress: false

permissions:
  contents: read  # pipelines write to the lake on Hugging Face, never to this repo

jobs:
  baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[forecast]"
      - name: Check HF token
        id: token
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::warning title=HF_TOKEN missing::Repository secret HF_TOKEN is not set; skipping. Add it with: gh secret set HF_TOKEN -R ${{ github.repository }}"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Day
        id: day
        run: |
          d="${{ inputs.day }}"; [ -n "$d" ] || d="$(date -u +%F)"
          echo "day=$d" >> "$GITHUB_OUTPUT"
      - name: Restore cached baselines (previous days)
        uses: actions/cache/restore@v4
        with:
          path: ~/looked-up-data/baselines
          key: baselines-${{ steps.day.outputs.day }}
          restore-keys: baselines-
      - name: Build baselines from the previous 28 days (local, never uploaded; ADR 0018)
        if: steps.token.outputs.present == 'true'
        run: python -m lookedup.cli baselines --day "${{ steps.day.outputs.day }}"
      - name: Save baselines to the Actions cache
        if: steps.token.outputs.present == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/looked-up-data/baselines
          key: baselines-${{ steps.day.outputs.day }}
      - name: Retrain forecast models (Mondays, Phase 4)
        if: steps.token.outputs.present == 'true' && (inputs.retrain || github.event_name == 'schedule')
        run: |
          if [ "${{ inputs.retrain }}" = "true" ] || [ "$(date -u +%u)" = "1" ]; then
            python -m lookedup.cli forecast-retrain
          else
            echo "not Monday: no retrain"
          fi
      - name: Snapshot yesterday's live bursts and stats from the live host (ADR 0032)
        if: steps.token.outputs.present == 'true' && vars.LIVE_URL != ''
        env:
          LIVE_URL: ${{ vars.LIVE_URL }}
        run: python -m lookedup.cli live-snapshot || echo "::warning::live-snapshot failed"
      - name: Score the live bursts of two days ago (Phase 5, H10 accumulates on the lake)
        if: steps.token.outputs.present == 'true'
        run: python -m lookedup.cli live-score || echo "::warning::live-score failed"
      - name: Check the live Worker's health (ADR 0033)
        if: vars.LIVE_URL != ''
        env:
          LIVE_URL: ${{ vars.LIVE_URL }}
        run: |
          # gap_minutes is capped at 60 (the whole live window), so ">= 60", not connected, or no answer all warn.
          body=$(curl -s --max-time 20 "$LIVE_URL/health" || true)
          echo "health: $body"
          verdict=$(printf '%s' "$body" | python3 -c "import json,sys
          try:
              h = json.load(sys.stdin)
              print('ok' if h.get('connected') and h.get('gap_minutes', 60) < 60 else 'gap=%s connected=%s' % (h.get('gap_minutes'), h.get('connected')))
          except Exception:
              print('no answer')")
          if [ "$verdict" != "ok" ]; then
            echo "::warning title=Live Worker not healthy::$verdict (see docs/ops.md, Live layer)"
          fi
