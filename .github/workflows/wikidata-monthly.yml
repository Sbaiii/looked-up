name: wikidata sitelinks

on:
  schedule:
    # wb_items_per_site comes from the monthly dump run (started on the 1st, written ~3 days later)
    - cron: "30 6 8 * *"
  workflow_dispatch:

concurrency:
  group: lake-writer-wikidata
  cancel-in-progress: false

permissions:
  contents: read  # pipelines write to the lake on Hugging Face, never to this repo

jobs:
  sitelinks:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - name: Check HF token
        id: token
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::warning title=HF_TOKEN missing::Repository secret HF_TOKEN is not set; skipping. Add it with: gh secret set HF_TOKEN -R ${{ github.repository }}"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and upload sitelinks for the active languages
        if: steps.token.outputs.present == 'true'
        run: python -m lookedup.cli wikidata
